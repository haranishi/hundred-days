<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#0b222c"/><path d="M-50 520Q310 190 550 390T1260 180" fill="none" stroke="#ddb775" stroke-width="5"/><path d="M-50 550Q310 220 550 420T1260 210" fill="none" stroke="#6baea4" stroke-width="3"/><g fill="#e8c88d"><circle cx="165" cy="380" r="10"/><circle cx="480" cy="350" r="10"/><circle cx="930" cy="320" r="10"/></g><text x="85" y="110" font-family="sans-serif" font-size="19" letter-spacing="6" fill="#b5c6c7">A LITTLE RAILWAY MYSTERY / DAY 068</text><text x="82" y="255" font-family="serif" font-size="88" fill="#f0e9d7">時刻表アリバイ。</text><text x="87" y="328" font-family="serif" font-size="32" fill="#cfddd6">列車は、嘘をつかない。</text><text x="85" y="570" font-family="sans-serif" font-size="23" fill="#b5c6c7">5つの駅、3人の証言。夜の鉄道を巻き戻して、矛盾を見つけよう。</text></svg>