<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- __KUMIMAE_*__ はビルド時に src/config/site.ts の値で置き換わる -->
    <title>__KUMIMAE_TITLE__</title>
    <meta name="description" content="__KUMIMAE_DESCRIPTION__" />
    <link rel="canonical" href="__KUMIMAE_URL__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__KUMIMAE_NAME__" />
    <meta property="og:title" content="__KUMIMAE_NAME__" />
    <meta property="og:description" content="__KUMIMAE_DESCRIPTION__" />
    <meta property="og:url" content="__KUMIMAE_URL__" />
    <meta property="og:image" content="__KUMIMAE_OG_IMAGE__" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="shared/share.css" />
    <script src="shared/share.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <dialog id="share-dialog" class="km-site-share" aria-labelledby="site-share-title">
      <h2 id="site-share-title">このアプリを共有する</h2>
      <div id="share"></div>
      <form method="dialog"><button type="submit">閉じる</button></form>
    </dialog>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
