<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>スクショに額縁を — プロモーション動画</title>
  <link rel="stylesheet" href="./promo.css">
</head>
<body>
  <main id="promo" aria-label="スクショに額縁を プロモーション動画">
    <div id="hero" aria-hidden="true">
      <div id="hero-card">
        <div id="hero-bg"></div>
        <img id="hero-image" src="/sample/sample.webp" alt="">
      </div>
    </div>

    <section id="title-scene" class="title-scene" aria-label="タイトル">
      <p id="challenge-label">DAY 027 · 100日チャレンジ</p>
      <h1 id="main-title">スクショに<br>額縁を</h1>
      <p id="main-lead">貼るだけで、<br>SNSに出せる1枚に。</p>
    </section>

    <div id="phone" class="phone" aria-label="スクショに額縁を アプリ画面">
      <div class="phone-speaker" aria-hidden="true"></div>
      <div class="phone-screen">
        <iframe id="app-frame" title="スクショに額縁を" data-src="/index.html"></iframe>
      </div>
    </div>

    <div id="keycap" aria-hidden="true">
      <span class="key">⌘</span>
      <span class="key">V</span>
    </div>

    <div id="focus-rings" aria-hidden="true">
      <div class="focus-ring"></div>
      <div class="focus-ring"></div>
    </div>
    <div id="tap-ripple" aria-hidden="true"></div>

    <section id="promise-scene" class="promise-scene" aria-label="このアプリの約束">
      <p>画像は、端末の外に出ない。</p>
      <p>業務画面でも、安心。</p>
      <p class="teal">通信ゼロ・登録なし・無料</p>
    </section>

    <section id="end-scene" class="end-scene" aria-label="スクショに額縁を URL">
      <h2>スクショに<br>額縁を</h2>
      <p class="url">hundred-days.pages.dev/<br>day-027-screenshot-frame/</p>
      <p class="day">100日チャレンジ Day 27</p>
    </section>

    <div id="caption" class="caption" aria-live="off"></div>
    <div id="fade-black" aria-hidden="true"></div>
  </main>
  <script type="module" src="./promo.js"></script>
</body>
</html>
