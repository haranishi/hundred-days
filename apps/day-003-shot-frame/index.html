<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スクショ映えメーカー</title>
  <meta name="description" content="スクショをドロップ/貼り付けすると余白・角丸・影・グラデ背景つきのSNS映え画像にしてPNG保存できるツール">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-state="empty">
  <main class="app">
    <header class="app__head">
      <h1 class="app__title">スクショ映えメーカー</h1>
      <span class="app__day">Day 003</span>
    </header>

    <!-- 画像の受け取り口。ドラッグ&ドロップ / クリックしてファイル選択 / 貼り付けの3経路 -->
    <section class="drop" id="drop">
      <input class="drop__input" id="file" type="file" accept="image/*">
      <label class="drop__label" for="file">
        <span class="drop__lead">スクショをドロップ</span>
        <span class="drop__sub">クリックしてファイルを選ぶ／⌘V・Ctrl+V で貼り付けもOK</span>
      </label>
      <p class="drop__note" id="drop-note" aria-live="polite"></p>
    </section>

    <p class="hint">画像はブラウザの中だけで処理されます。どこにも送信しません</p>

    <!-- 画像を読み込むまでは出さない。プレビューと設定はここだけ -->
    <section class="editor" id="editor" hidden>
      <div class="stage" id="stage">
        <canvas class="stage__canvas" id="preview" role="img" aria-label="整形したスクショのプレビュー"></canvas>
      </div>

      <div class="panel">
        <div class="control">
          <span class="control__label" id="bg-label">背景</span>
          <!-- チップはscript.jsのプリセット定義から作る（色見本と実際の描画をずらさないため） -->
          <div class="chips" id="bg" role="group" aria-labelledby="bg-label"></div>
        </div>

        <div class="control">
          <label class="control__label" for="pad">余白</label>
          <span class="control__value" id="pad-value" aria-hidden="true">10%</span>
          <input
            class="control__range"
            id="pad"
            type="range"
            min="4"
            max="20"
            step="1"
            value="10">
        </div>

        <div class="control">
          <label class="control__label" for="radius">角丸</label>
          <span class="control__value" id="radius-value" aria-hidden="true">2.5%</span>
          <input
            class="control__range"
            id="radius"
            type="range"
            min="0"
            max="6"
            step="0.5"
            value="2.5">
        </div>

        <div class="control">
          <label class="control__label" for="shadow">影</label>
          <span class="control__value" id="shadow-value" aria-hidden="true">55</span>
          <input
            class="control__range"
            id="shadow"
            type="range"
            min="0"
            max="100"
            step="1"
            value="55">
        </div>

        <p class="panel__info" id="info"></p>
        <button type="button" class="btn btn--primary" id="save">PNGで保存</button>
      </div>
    </section>

    <footer class="foot">
      <a class="foot__link" href="../">← 100 DAYS / 100 APPS</a>
    </footer>
  </main>
</body>
</html>
