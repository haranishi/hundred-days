<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E7" />
    <meta name="format-detection" content="telephone=no" />
    <title>ミニチュア観光名所バトル</title>
    <meta name="description" content="組み上がっていく名所のミニチュアを見て、どこかを早押しの4択で当てるゲーム。ひとりでも、1台をふたりで囲んでも遊べる。" />
    <meta name="share:text" content="ミニチュア観光名所バトル — 組み上がる模型を見て、名所を早押しの4択で当てるゲーム。ひとりでも、ふたりでも。" />
    <!-- canonical・og:*・twitter:* は、リポジトリの共通ビルド（scripts/build.mjs）が meta.json から差し込む -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- 共通の共有部品。手元の vite では 404 になる（公開物の ../shared/ は npm run shared:sync が置く） -->
    <link rel="stylesheet" href="shared/share.css" />
    <script src="shared/share.js" defer></script>
    <style>
      /* 読み込みの間も白く光らせない */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f1e7;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1f2a44;
        font: 700 16px/1.6 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
      </div>
    </div>
    <dialog id="share-dialog" class="day-share-dialog" aria-labelledby="share-dialog-title">
      <h2 id="share-dialog-title">このアプリを共有する</h2>
      <div id="share"></div>
      <form method="dialog" class="day-share-close"><button type="submit">閉じる</button></form>
    </dialog>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
