<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>置き面の高さを測る（確認用）</title></head>
<body>
<pre id="out">測っています…</pre>
<script type="module">
// 家具の中に上から光線を落とし、当たった面の高さ（m）を一覧にする。棚の段・座面・天板の高さを決めるための道具。
// ?ids=bench,bookshelf のように指定する。格子は家具の幅と奥行きを5等分した点。
import * as THREE from '../vendor/three.js';
import { GLTFLoader } from '../vendor/three.js';

const ids = (new URLSearchParams(location.search).get('ids') || '').split(',').filter(Boolean);
const loader = new GLTFLoader();
const result = {};
for (const id of ids) {
  const gltf = await loader.loadAsync(`../assets/models/${id}.glb`);
  const root = gltf.scene;
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const ray = new THREE.Raycaster();
  const rows = [];
  for (const fx of [0.2, 0.35, 0.5, 0.65, 0.8]) {
    for (const fz of [0.2, 0.5, 0.8]) {
      const x = box.min.x + (box.max.x - box.min.x) * fx;
      const z = box.min.z + (box.max.z - box.min.z) * fz;
      ray.set(new THREE.Vector3(x, box.max.y + 1, z), new THREE.Vector3(0, -1, 0));
      const hits = ray.intersectObject(root, true).filter(h => h.face && h.face.normal.clone().transformDirection(h.object.matrixWorld).y > 0.7);
      rows.push({ x: +x.toFixed(2), z: +z.toFixed(2), up: [...new Set(hits.map(h => +h.point.y.toFixed(3)))] });
    }
  }
  result[id] = { min: box.min.toArray().map(v => +v.toFixed(3)), max: box.max.toArray().map(v => +v.toFixed(3)), rows };
}
document.getElementById('out').textContent = JSON.stringify(result);
window.__probe = result;
window.__sheetReady = true;
</script>
</body>
</html>
