<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>模型の一覧（確認用）</title>
<style>
  html, body { margin: 0; background: #d9d6cf; font: 12px/1.3 system-ui, sans-serif; }
  #sheet { display: grid; grid-template-columns: repeat(8, 220px); gap: 4px; padding: 4px; }
  figure { margin: 0; background: #eeeae3; }
  figure canvas { display: block; width: 220px; height: 220px; }
  figcaption { padding: 2px 4px 4px; color: #222; }
  figcaption b { display: block; }
</style>
</head>
<body>
<div id="sheet"></div>
<script type="module">
// 素材の確認用。1つずつ斜め前から撮り、+Z（手前に来るはずの面）を青、1m の物差しを赤で添える。
// 読み込み: scripts/model-sheet.mjs が撮影して1枚の画像にする。?ids=a,b で絞れる。
import * as THREE from '../vendor/three.js';
import { GLTFLoader, RoomEnvironment } from '../vendor/three.js';

const params = new URLSearchParams(location.search);
const manifest = await (await fetch('../data/models.json')).json();
let ids = Object.keys(manifest.models);
if (params.get('ids')) ids = params.get('ids').split(',');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(440, 440, false);
renderer.toneMapping = THREE.AgXToneMapping;
const pmrem = new THREE.PMREMGenerator(renderer);
const env = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const loader = new GLTFLoader();
const sheet = document.getElementById('sheet');

for (const id of ids) {
  const gltf = await loader.loadAsync(`../assets/models/${id}.glb`);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeeeae3);
  scene.environment = env;
  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(2, 4, 3);
  scene.add(sun);
  const model = gltf.scene;
  scene.add(model);
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 0.5);
  // 1m の物差し（赤）と +Z の向き（青）
  const ruler = new THREE.Mesh(new THREE.BoxGeometry(0.02, 1, 0.02), new THREE.MeshBasicMaterial({ color: 0xd0302a }));
  ruler.position.set(box.max.x + 0.08, box.min.y + 0.5, center.z);
  scene.add(ruler);
  const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(center.x, box.min.y + 0.01, box.max.z), Math.max(0.15, radius * 0.4), 0x2255dd);
  scene.add(arrow);
  const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
  const dir = new THREE.Vector3(0.55, 0.45, 1).normalize();
  camera.position.copy(center).addScaledVector(dir, radius / Math.sin(THREE.MathUtils.degToRad(17)));
  camera.lookAt(center);
  renderer.render(scene, camera);
  const fig = document.createElement('figure');
  const canvas = document.createElement('canvas');
  canvas.width = 440; canvas.height = 440;
  canvas.getContext('2d').drawImage(renderer.domElement, 0, 0);
  const m = manifest.models[id];
  fig.append(canvas);
  const cap = document.createElement('figcaption');
  cap.innerHTML = `<b>${id}</b>${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} m・${m ? m.tris : '?'}面`;
  fig.append(cap);
  sheet.append(fig);
}
window.__sheetReady = true;
</script>
</body>
</html>
