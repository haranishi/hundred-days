# rairakku.com/day<番号>/ を day<番号>.rairakku.com へ転送する Worker（外部Day共通）。出し方は README.md。
# アカウントは環境変数 CLOUDFLARE_ACCOUNT_ID で指す（ここには書かない）。
name = "rairakku-day-redirect"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = false   # 公開の *.workers.dev の住所は作らない
routes = [{ pattern = "rairakku.com/day*", zone_name = "rairakku.com" }]
