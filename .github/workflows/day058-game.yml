name: Day58 game checks
on:
  pull_request:
    branches: [main]
    paths: ['day-058-meisho-kumitate/**', '.github/workflows/day058-game.yml']
  push:
    branches: [main]
    paths: ['day-058-meisho-kumitate/**', '.github/workflows/day058-game.yml']
permissions:
  contents: read
jobs:
  game:
    name: Day58 rules tests and release build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: day-058-meisho-kumitate/source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: day-058-meisho-kumitate/source/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run release
      # 変更・削除・未追跡のどれが出ても止める（git diff だけだと、新しく増えたファイルを見逃す）
      - name: Check committed release is reproducible
        run: |
          changed="$(git status --porcelain -- ../index.html ../assets ../favicon.svg ../apple-touch-icon.png)"
          if [ -n "$changed" ]; then echo "$changed"; git diff --stat -- ..; exit 1; fi
