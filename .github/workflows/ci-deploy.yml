name: CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Pre-publish, syntax, unit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Configure scan identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

      # フォークPRでも、秘密値を渡さずに共通の漏洩検査を実行する。
      - name: Run public pre-publish scan
        run: npm run precheck -- --public

      # 非公開のNGワードは同一リポジトリのPR・mainだけで検査する。
      - name: Run private pre-publish scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PRECHECK_NG_PATTERNS: ${{ secrets.PRECHECK_NG_PATTERNS }}
        run: |
          test -n "$PRECHECK_NG_PATTERNS"
          printf '%s\n' "$PRECHECK_NG_PATTERNS" > .precheck-ng.txt
          npm run precheck

      - name: Remove private scan configuration
        if: always()
        run: rm -f .precheck-ng.txt

      - name: Check first-party JavaScript syntax
        run: npm run check:syntax

      # 依存の要らないテストを先に。ブラウザを入れる前に落とせる
      - name: Run unit tests
        run: npm run test:unit

      - name: Audit all npm lockfiles including source and tools
        run: npm run audit:deps

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

  browser:
    name: Browser tests (${{ matrix.shard }}/4)
    needs: checks
    runs-on: ubuntu-latest
    # 直近の全E2Eは約51分。ファイル単位で分割し、テスト内の実行順と1 workerを維持する。
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build

      # ⚠️ --with-deps は apt-get を走らせる。2026-08-19にUbuntuのミラーが応答せず
      # ここで15分ハングし、ジョブのタイムアウトで2回続けて落ちた（テストは1件も走らなかった）。
      # ランナーの標準イメージにChromiumの共有ライブラリは入っているので、ブラウザ本体だけ取る。
      # 足りないものがあればブラウザの起動で明確に失敗するので、黙って壊れることはない。
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Run browser tests
        id: browser
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Save failure report, screenshots and traces
        if: ${{ !cancelled() && steps.browser.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failure-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  day080:
    name: Day080 source, release and gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: day-080-fifth-prince/source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: day-080-fifth-prince/source/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run release:static
      - name: Require the committed release to match source
        working-directory: .
        run: git diff --exit-code -- day-080-fifth-prince/index.html day-080-fifth-prince/assets day-080-fifth-prince/fonts day-080-fifth-prince/favicon.svg day-080-fifth-prince/og-cover.png day-080-fifth-prince/shared
      - name: Install gameplay browser
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Play all gameplay regressions
        run: npm run test:e2e
      - name: Save gameplay failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: day080-gameplay-failure
          path: |
            day-080-fifth-prince/source/playwright-report/
            day-080-fifth-prince/source/test-results/
          retention-days: 7

  # ブランチ保護の必須チェック名を維持し、失敗・キャンセル・skipを成功に見せない。
  test:
    name: Build and browser test
    if: ${{ always() }}
    needs: [checks, browser, day080]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          GAME_RESULT: ${{ needs.day080.result }}
        run: |
          printf 'Quick checks: %s\nBrowser tests: %s\n' "$CHECKS_RESULT" "$BROWSER_RESULT"
          test "$CHECKS_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$GAME_RESULT" = success

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    # 配信するファイル数も増える（Day 041 の同梱データで 1,006 → 1,377 本）。
    # 初回だけ全部アップロードするので、ここも余裕を持たせる
    timeout-minutes: 20
    environment:
      name: production
      url: https://hundred-days.pages.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.115.0"
          command: >-
            pages deploy dist --project-name=hundred-days
            --branch=main --commit-hash=${{ github.sha }}
        env:
          WRANGLER_SEND_METRICS: false
