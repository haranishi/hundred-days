name: Day076 source
on:
  pull_request:
    branches: [main]
    paths: ['day-076-henkan-desk/**', '.github/workflows/day076-source.yml']
  push:
    branches: [main]
    paths: ['day-076-henkan-desk/**', '.github/workflows/day076-source.yml']
permissions:
  contents: read
jobs:
  source:
    name: Day076 source and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: day-076-henkan-desk/source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: day-076-henkan-desk/source/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run release:static
      - name: Verify committed public release
        working-directory: .
        run: git diff --exit-code -- day-076-henkan-desk/index.html day-076-henkan-desk/assets day-076-henkan-desk/pdf-assets day-076-henkan-desk/licenses day-076-henkan-desk/shared day-076-henkan-desk/legal.html day-076-henkan-desk/legal.css day-076-henkan-desk/ogp.png day-076-henkan-desk/favicon.svg
