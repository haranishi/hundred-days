name: Day56 game checks
on:
  pull_request:
    branches: [main]
    paths: ['day-056-dragon-rush/**', '.github/workflows/day056-game.yml']
  push:
    branches: [main]
    paths: ['day-056-dragon-rush/**', '.github/workflows/day056-game.yml']
permissions:
  contents: read
jobs:
  game:
    name: Day56 engine tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: day-056-dragon-rush/source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: day-056-dragon-rush/source/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - name: Check committed release is reproducible
        run: git diff --exit-code -- ../game
