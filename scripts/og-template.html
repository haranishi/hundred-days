<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OG image source</title>
<style>
  @font-face {
    font-family:"Big Shoulders Display";
    src:url("../static/assets/fonts/BigShouldersDisplay-latin-wght.woff2") format("woff2");
    font-weight:100 900;
    font-display:swap;
  }
  @font-face {
    font-family:"Geist Mono";
    src:url("../static/assets/fonts/GeistMono-latin-wght.woff2") format("woff2");
    font-weight:100 900;
    font-display:swap;
  }
  :root { --bg:#0f0e0d; --ink:#f3ede3; --muted:#a39a8e; --signal:#ff5a36; --line:rgba(243,237,227,.10); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1200px; height:630px; }
  body {
    display:grid;
    grid-template-columns:minmax(0,1fr) 336px;
    grid-template-rows:1fr auto;
    gap:40px;
    padding:64px;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  }
  .copy { align-self:center; }
  .eyebrow { color:var(--muted); font-size:18px; margin-bottom:24px; }
  .eyebrow::before { content:""; display:inline-block; width:10px; height:10px; margin-right:12px; background:var(--signal); }
  h1 { font:800 156px/.86 "Big Shoulders Display",Impact,sans-serif; letter-spacing:-.01em; }
  h1 span { display:block; white-space:nowrap; }
  h1 span + span { margin-top:.10em; }
  .matrix { display:grid; grid-template-columns:repeat(10,1fr); gap:6px; align-self:center; list-style:none; }
  .matrix li { aspect-ratio:1; border-radius:5px; }
  .matrix .is-lit { background:rgba(243,237,227,calc(.36 + .54 * var(--i) / 100)); }
  .matrix .is-latest { background:var(--signal); }
  .matrix .is-todo { border:1px solid var(--line); }
  .foot { grid-column:1 / -1; display:flex; justify-content:space-between; gap:24px; padding-top:24px; border-top:1px solid var(--line); font:400 18px/1.6 "Geist Mono",monospace; color:var(--muted); }
  .url { font-size:20px; color:var(--ink); white-space:nowrap; }
</style>
</head>
<body>
  <div class="copy"><p class="eyebrow">100日チャレンジ</p><h1><span>100 DAYS</span><span>/ 100 APPS</span></h1></div>
  <ol class="matrix" aria-hidden="true"></ol>
  <div class="foot"><span>アカウント登録不要・課金なし・個人データなし</span><span class="url">hundred-days.pages.dev</span></div>
<script>
  /* 点灯するマスの数は、作った時点の最新のDay（make-og.mjs が ?lit=N で渡す）。数字の文字は絵に入れないが、実態より進んだ絵にもしない */
  const lit = Math.min(100, Number(new URLSearchParams(location.search).get('lit')) || 77);
  const matrix = document.querySelector('.matrix');
  for (let i = 0; i < 100; i++) {
    const li = document.createElement('li');
    li.style.setProperty('--i', i);
    li.className = i === lit - 1 ? 'is-latest' : i < lit ? 'is-lit' : 'is-todo';
    matrix.appendChild(li);
  }
</script>
</body>
</html>
