services:
  gateway:
    build:
      context: ..
      dockerfile: infra/gateway.Dockerfile
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4173}
      ENGINE_URL: http://engine:3001
    depends_on:
      - engine
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    memswap_limit: 512m
    tmpfs: [/tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777]
    ulimits:
      core: 0
    restart: on-failure
    networks: [private, public]
  engine:
    build:
      context: ..
      dockerfile: infra/engine.Dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    memswap_limit: 2g
    tmpfs: [/tmp:rw,nosuid,nodev,size=512m,mode=1777]
    ulimits:
      core: 0
    restart: on-failure
    networks: [private]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/internal/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
networks:
  private:
    internal: true
  public: {}
