<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>ちかくのWi-Fi — プロモーション動画</title>
  <link rel="stylesheet" href="./promo.css">
</head>
<body>
  <main id="promo" aria-label="ちかくのWi-Fi プロモーション動画">
    <div id="phone" class="phone" aria-label="ちかくのWi-Fi アプリ画面">
      <div class="phone-speaker" aria-hidden="true"></div>
      <div class="phone-screen">
        <iframe id="app-frame" title="ちかくのWi-Fi" data-src="/index.html"></iframe>
      </div>
    </div>

    <section id="title-scene" class="title-scene" aria-label="タイトル">
      <p id="challenge-label">DAY 029 · 100日チャレンジ</p>
      <h1 id="main-title">ちかくのWi-Fi</h1>
      <p id="main-lead">いまいる場所から、<br>Wi-Fiが使える場所へ。</p>
    </section>

    <div id="focus-rings" aria-hidden="true">
      <div class="focus-ring"></div>
      <div class="focus-ring"></div>
    </div>
    <div id="tap-ripple" aria-hidden="true"></div>

    <section id="promise-scene" class="promise-scene" aria-label="このアプリの約束">
      <p>現在地は端末の中だけ。</p>
      <p>載っているのは公開データ。</p>
      <p class="accent">登録なし・無料</p>
    </section>

    <section id="end-scene" class="end-scene" aria-label="ちかくのWi-Fi URL">
      <h2>ちかくのWi-Fi</h2>
      <p class="url">hundred-days.pages.dev/<br>day-029-nearby-wifi/</p>
      <p class="day">100日チャレンジ Day 29</p>
    </section>

    <div id="caption" class="caption" aria-live="off"></div>
    <div id="fade-black" aria-hidden="true"></div>
  </main>
  <script type="module" src="./promo.js"></script>
</body>
</html>
