<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8EC" />
    <title>ページが見つかりません — スーパーやりたい放題</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff8ec;
        color: #2b2b3a;
        font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 420px;
        width: 100%;
        padding: 28px 24px;
        border-radius: 20px;
        background: #ffffff;
        border: 3px solid #2b2b3a;
        box-shadow: 0 6px 0 rgba(43, 43, 58, 0.18);
        text-align: center;
      }
      .code {
        display: inline-block;
        padding: 4px 14px;
        border-radius: 999px;
        background: #ffc93c;
        border: 2px solid #2b2b3a;
        font-size: 13px;
        font-weight: 900;
      }
      h1 {
        margin: 14px 0 8px;
        font-size: 22px;
        font-weight: 900;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 14px;
        background: #e8423f;
        border: 3px solid #2b2b3a;
        box-shadow: 0 4px 0 rgba(43, 43, 58, 0.22);
        color: #ffffff;
        font-size: 15px;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <span class="code">404</span>
        <h1>ページが見つかりません</h1>
        <p>お探しの売り場は移動したか、見つかりませんでした。</p>
        <a href="/">スーパーの入口へもどる</a>
      </div>
    </main>
  </body>
</html>
