<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8EC" />
    <meta name="format-detection" content="telephone=no" />
    <title>スーパーやりたい放題</title>
    <meta name="description" content="スーパーで「やっちゃダメ」なことを2分間やりまくり、荒らし度を競う3Dゲーム。ひとりでCPUと勝負しても、リンクで友だちとネット対戦しても遊べる。" />
    <!-- 公開先の URL は src/client/site.ts と同じにする（食い違いは tests/e2e/meta.spec.ts が見つける） -->
    <link rel="canonical" href="https://day94.rairakku.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="スーパーやりたい放題" />
    <meta property="og:title" content="スーパーやりたい放題" />
    <meta property="og:description" content="試食を食べ尽くし、店内放送をジャックし、カートで爆走。スーパーの「やっちゃダメ」を2分間で全部やれ。友だちとリンクで対戦できる。" />
    <meta property="og:url" content="https://day94.rairakku.com/" />
    <meta property="og:image" content="https://day94.rairakku.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      /* 読み込みの間も白く光らせない */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff8ec;
        overscroll-behavior: none;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2b2b3a;
        font: 700 16px/1.6 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <!--
      #stage：3Dの描画（canvas を入れる）＝ゲームの芯の担当
      #hud：ゲーム中の表示とタッチ操作＝ゲームの芯の担当
      #screens：タイトル〜結果の画面＝画面と音の担当
    -->
    <div id="app">
      <div id="stage"></div>
      <div id="hud"></div>
      <div id="screens">
        <div class="boot">
          読み込み中…
          <noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
        </div>
      </div>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
