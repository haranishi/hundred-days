# 体験（滑りの手ごたえ）を採点して磨く周回の契約
meta: {name: "ginrei-gamefeel", version: "1.0.0", status: active, owner: "作者"}
core_loop: >
  山の上で自分のラインを選び、切る・削る・飛ぶの手ごたえを味わい、残った跡を見て、もう1本別のラインを滑りたくなる。
feel_definition: >
  エッジを立てると雪を切って曲がり、板を横へ向けると雪を削って減速する。その違いが、姿勢・雪煙・音・跡で同時に分かる。
roles:
  - {role: design,    runner: "設計役", does: "体験の目標と採点表を決め、改善の指示を上位5件に絞る"}
  - {role: implement, runner: "実装役", does: "コードと試験。物理の規則には必ず試験を付ける"}
  - {role: gate,      runner: "決定的な道具", does: "単体試験・起動の検査・指の操作の検査が全部通るまで採点へ進ませない"}
  - {role: evaluate,  runner: "実装役と別の担い手（別の会話）", does: "実ブラウザで実際に操作して採点。コードは見ない"}
  - {role: final,     runner: "作者", does: "5分遊んで合否を決める"}
how_to_play_for_evaluator:
  - "評価者は1手に数秒かかるので、手動送りで遊ぶ。試験用の窓口で操作を与え、0.25〜1秒ずつ時間を送り、画面と状態を見る"
  - "座標や速さを書き換えて結果を作らない。与えてよいのは、プレイヤーと同じ操作と、出発地点への移動だけ"
  - "音は聞こえないので「未確認」と書く。音の計測値（音量の時系列）だけ確かめる"
  - "操作の証拠として、場面ごとの画像と、操作と状態の記録を残す"
rubric:   # 10項目 × 0〜2点。合格は16点以上かつ0点なし
  - {id: 1,  name: "30秒で分かる",       look: "説明を読まずに曲がれて、最初の気持ちよさまでが速い"}
  - {id: 2,  name: "切ると削るの違い",   look: "切るターンと横滑りが、動き・姿勢・雪煙・跡で別物に見える"}
  - {id: 3,  name: "操作の手ごたえ",     look: "入力にすぐ応える。エッジの切り替えに重さがあり、遅れすぎない"}
  - {id: 4,  name: "速さと斜度",         look: "急な面で速く、緩い面で遅い。速さが画面から伝わる"}
  - {id: 5,  name: "起伏と荷重",         look: "凹みで沈み、凸で浮く。小さな起伏で飛べる"}
  - {id: 6,  name: "ジャンプと着地",     look: "構えて離して飛べる。着地の成否が予想でき、理由が分かる"}
  - {id: 7,  name: "失敗の納得感",       look: "理不尽な転倒が無い。転んでも2操作・3秒以内に滑り直せる"}
  - {id: 8,  name: "見通し",             look: "体が前を隠さず、次の起伏・木・着地先が読める"}
  - {id: 9,  name: "山の変化",           look: "3分滑って単調でない。雪質と地形で滑りが変わる"}
  - {id: 10, name: "進行の信頼",         look: "すり抜け・はまり・進行不能が無い"}
loop_control:
  order: "体験が合格してから、見た目の周回（ginrei-visual）へ進む"
  retry: "不合格なら上位5件だけを実装へ戻す。上限3周。同じ指摘が2周続いたら止めて作者へ返す"
  fresh_eyes: "採点は毎回新しい会話で、ゼロから行う。前回の採点表は差分の確認にだけ渡す"
  before_fixing: "指摘を実装の課題にする前に、設計役がコードと記録で裏を取る。撮影や手動送りの不備を先に疑う"
limits:
  - "AI の「気持ちいい」は人の感覚の代理。実機のスマホの操作感と音は、作者が確かめる"
receipt: ".agent-harness/runs/gamefeel/<周>/ に、採点表・操作の記録・画像・直した点と直さなかった点（理由つき）を残す"
