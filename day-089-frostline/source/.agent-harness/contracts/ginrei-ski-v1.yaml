# スキーを足した後の採点の契約（体験と見た目を、スキーに絞って見る）
# 全体の体験の契約（ginrei-gamefeel-v2）は、スノーボードで 3 周して閉じた（13 → 15 → 15 点）。ここでは、スキーで足した所だけを採点する。
meta: {name: "ginrei-ski", version: "1.0.0", status: active, owner: "作者"}
aim: >
  同じ山・同じ操作のまま、スキーでも滑れる。止めた絵 1 枚で「スキーの人」と分かり、滑りの違い（曲がりが大きい・切り替えが軽い・速い）を一文で言える。
roles:
  - {role: design,    runner: "設計役", does: "ねらいと採点表を決め、直す所を上位5件に絞る"}
  - {role: implement, runner: "実装役", does: "コードと試験。物理の違いには、スノーボードと並べた測定を付ける"}
  - {role: gate,      runner: "決定的な道具", does: "単体試験・起動の検査・指の操作の検査・仕掛けをスキーで飛ぶ検査が通るまで、採点へ進ませない"}
  - {role: evaluate,  runner: "実装役と別の担い手（別の会話）", does: "体験は実ブラウザで操作して、見た目は画像で採点。コードは見ない"}
  - {role: final,     runner: "作者", does: "スキーで一本滑って、合否を決める"}
gate_before_scoring:
  - "進行を止める不具合（道具を替えると動かない・すり抜け・はまり）が1件でもあれば、点に関係なく不合格"
  - "スノーボードの試験が、変えずに通っていること"
rubric_feel:   # 体験：8項目 × 0〜2点。合格は13点以上かつ0点なし
  - {id: 1, name: "道具の選び方",       look: "題字の画面と設定で、迷わず替えられる。選んだ道具を覚えている。滑走の途中で替えても、おかしくならない"}
  - {id: 2, name: "違いが分かる",       look: "同じ斜面で、スノーボードより、曲がりが大きく・切り替えが軽く・低い姿勢が速い、を数値と画面で感じる"}
  - {id: 3, name: "切るターン",         look: "板が 2 本そろって傾き、体が内側へ倒れる。舵にすぐ応える。跡が 2 本の細い線になる"}
  - {id: 4, name: "制動と停止",         look: "板が横を向いて雪煙が出る。進む線が変わらない。止まってから滑り出すとき、前向きで出る"}
  - {id: 5, name: "低い姿勢と平らな所", look: "低い姿勢で速くなる。平らな所で、ストックで押して進める。案内の文が、スキーの言い方になっている"}
  - {id: 6, name: "ジャンプと技",       look: "台と段を、スキーで狙って飛べる。回転・宙返り・つかみが決まり、技の名前がスキーの呼び方で出る"}
  - {id: 7, name: "失敗と復帰",         look: "転倒の理由が出る。復帰・やり直しが、スノーボードと同じ手数でできる。理不尽な転倒が無い"}
  - {id: 8, name: "滑走中の見え方",     look: "後ろからの視点で、スキーの人に見える。板とストックが、体や雪面にめり込まない。動きがぎこちなくない"}
rubric_look:   # 見た目：8項目 × 0〜2点。合格は13点以上かつ0点なし
  - {id: 1, name: "スキーの人に見えるか", look: "板 2 本・ストック・進む向きを向いた体が、ひと目で分かる"}
  - {id: 2, name: "板と金具",             look: "長さと幅・先の反り・縁・金具が作ってある。靴と板のつながりが自然"}
  - {id: 3, name: "ストック",             look: "握り・帯・先の輪がある。手に持って見える。向きが自然（体や板に刺さらない）"}
  - {id: 4, name: "脚と足首",             look: "ひざとすねの傾きが自然。ひざが内側へ折れない。足首がねじれない。2 本の板が平行"}
  - {id: 5, name: "切る姿勢",             look: "内側へ倒れ、外側の足が伸び、内側の足が曲がる。上半身が板と一緒に倒れすぎない"}
  - {id: 6, name: "低い姿勢・制動・空中", look: "それぞれ、スキーの動きに見える。つかみで、手が板に届く"}
  - {id: 7, name: "破綻の無さ",           look: "めり込み・裏返り・穴・浮いた部品が無い"}
  - {id: 8, name: "スノーボードとの差",   look: "並べて見て、別の道具・別の構えだと、すぐ分かる"}
loop_control:
  retry: "不合格なら上位5件だけを実装へ戻す。体験・見た目とも上限3周。同じ指摘が2周続いたら止めて作者へ返す"
  fresh_eyes: "採点は毎回新しい会話で、ゼロから行う"
  before_fixing: "指摘を課題にする前に、設計役がコードと記録で裏を取る。直しの確認は、指摘が出た場面そのもので行う"
limits:
  - "AI の採点は、人の感覚の代理。スキー経験者としての違和感・実機のスマホ・音は、作者が確かめる"
receipt: ".agent-harness/runs/ski/{feel,look}/<周>/ に、採点表・画像・直した点と直さなかった点（理由つき）を残す"
