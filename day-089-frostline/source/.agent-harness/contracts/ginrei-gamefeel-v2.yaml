# 体験を採点して磨く周回の契約・2版（M2「遊びの幅」）
# 1版（ginrei-gamefeel-v1）との違い：技・地形の仕掛け・続ける流れを採点項目に足した。「進行の信頼」は点でなく門にした。
# 採点項目が変わったので、周回は 1 から数え直す（1版は 3 周で 14 点・不合格のまま閉じた）。
meta: {name: "ginrei-gamefeel", version: "2.0.0", status: active, owner: "作者"}
core_loop: >
  山の上で自分のラインを選び、切る・削る・飛んで回るの手ごたえを味わい、駅で一本の記録を見て、1操作で次の一本へ行く。
roles:
  - {role: design,    runner: "設計役", does: "体験の目標と採点表を決め、改善の指示を上位5件に絞る"}
  - {role: implement, runner: "実装役", does: "コードと試験。物理と遊びの決まりには必ず試験を付ける"}
  - {role: gate,      runner: "決定的な道具", does: "単体試験・起動の検査・指の操作の検査・山の物理の検査が全部通るまで採点へ進ませない"}
  - {role: evaluate,  runner: "実装役と別の担い手（別の会話）", does: "実ブラウザで実際に操作して採点。コードは見ない"}
  - {role: final,     runner: "作者", does: "5分遊んで合否を決める"}
how_to_play_for_evaluator:
  - "手動送りで遊ぶ。試験用の窓口で操作を与え、0.1〜1秒ずつ時間を送り、画面と状態を見る"
  - "座標や速さを書き換えて結果を作らない。与えてよいのは、プレイヤーと同じ操作・画面のボタン・出発地点への移動・仕掛けの手前（ゲームがやり直しで戻す所）からの開始だけ"
  - "技は、ジャンプ台で実際に出す（構えて離す → 空中でジャンプボタンを押しながら舵）。回った量は状態の値と画像の両方で確かめる"
  - "音は聞こえないので「未確認」と書く。動きのぼかしのように止めた画像に写らないものも「未確認」と書く"
  - "操作の証拠として、場面ごとの画像と、操作と状態の記録を残す"
gate_before_scoring:
  - "進行を止める不具合（すり抜け・はまり・操作不能・画面の誤り）が1件でもあれば、点に関係なく不合格"
rubric:   # 10項目 × 0〜2点。合格は16点以上かつ0点なし
  - {id: 1,  name: "30秒で分かる",       look: "説明を読まずに曲がれて、最初の気持ちよさまでが速い"}
  - {id: 2,  name: "切ると削るの違い",   look: "切るターンと横滑りが、動き・姿勢・雪煙・跡で別物に見える。削ると減速する"}
  - {id: 3,  name: "操作の手ごたえ",     look: "入力にすぐ応える。制動は強さを選べ、離しても板が暴れない"}
  - {id: 4,  name: "速さと斜度",         look: "急な面で速く、緩い面で遅い。険しい面で怖さと速さが伝わる"}
  - {id: 5,  name: "ジャンプ台と崖",     look: "台と崖で狙って飛べる。飛距離と着地の成否が、入る速さから予想できる"}
  - {id: 6,  name: "技",                 look: "スピン・宙返り・つかみを狙って出せる。回りすぎ・足りないの結果が予想でき、名前と点が返る"}
  - {id: 7,  name: "失敗の納得感",       look: "理不尽な転倒が無い。転んでも2操作・3秒以内に、同じ仕掛けへ挑み直せる"}
  - {id: 8,  name: "見通し",             look: "体が前を隠さず、次の起伏・台・着地先が読める。空中で全身と着地先が見える"}
  - {id: 9,  name: "山の変化",           look: "地点ごとに遊び方が違う（雪原・森・急な面・台・沢）。3分滑って単調でない"}
  - {id: 10, name: "続けたくなる流れ",   look: "滑り終えてから次の一本まで迷わず、1〜2操作で滑り出せる。次に狙うもの（課題・地点）が見える"}
loop_control:
  order: "体験が合格してから、画面の採点（記録の画面・地図）と見た目の採点（滑走者）へ進む"
  retry: "不合格なら上位5件だけを実装へ戻す。上限3周。同じ指摘が2周続いたら止めて作者へ返す"
  fresh_eyes: "採点は毎回新しい会話で、ゼロから行う。前回の採点表は差分の確認にだけ渡す"
  before_fixing: "指摘を実装の課題にする前に、設計役がコードと記録で裏を取る。撮影や手動送りの不備を先に疑う"
limits:
  - "AI の「気持ちいい」は人の感覚の代理。実機のスマホの操作感・音・速さの感じ方は、作者が確かめる"
receipt: ".agent-harness/runs/gamefeel2/<周>/ に、採点表・操作の記録・画像・直した点と直さなかった点（理由つき）を残す"
