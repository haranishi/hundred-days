# 見た目を、本人の参考画像との固定撮影で磨く周回の契約・2版（谷と湖のマップ）
# 1版との違い：参考は「実際の雪山の写真」でなく、本人が渡した参考画像 9 枚（refs/valley/）。視点は山のデータの views（景色を見る）。
meta: {name: "ginrei-visual", version: "2.0.0", status: active, owner: "作者"}
goal: >
  参考画像と同じ 9 つの視点で撮った画が、参考画像と並べて「同じ場所の、同じ物」に見える。
  配置は本人の指示（北に山頂・中央に谷・西に岩壁と氷河・東にゲレンデとリフト・南に凍った湖と集落）を優先する。
references:
  source: "本人が 2026-11-10 に渡した 9 枚（docs/references.md）。ゲームには画像そのものを入れない"
  storage: "refs/valley/（Git に入れない）"
shots:
  rule: "node tools/shots/refviews.mjs --out DIR で、視点ごとに自分の画と、参考と左右に並べた絵（*-pair.png）を撮る。同じ地形と物を、カメラだけ変えて写す"
  note: "参考画像は、建物や木に対して山と湖が小さく描かれている（絵として詰めてある）。寸法の一致ではなく、位置関係と見え方の一致を見る"
roles:
  - {role: design,    runner: "設計役", does: "指摘を「山のデータで直す・形のデータで直す・描画で直す」に仕分け、上位5件に絞る"}
  - {role: implement, runner: "実装役（山と形は Codex、描画は設計役）", does: "直す。山と形は、撮った絵を渡して直させる"}
  - {role: gate,      runner: "決定的な道具", does: "単体試験・起動の検査（誤り・警告なし）・毎秒 60 コマ"}
  - {role: evaluate,  runner: "実装役と別の担い手（別の会話）", does: "並べた絵だけを見て採点。コードは見ない"}
  - {role: final,     runner: "作者", does: "実画面で「景色を見る」を回して、合否を決める"}
rubric:   # 10項目 × 0〜2点。合格は16点以上かつ0点なし
  - {id: 1,  name: "配置",       look: "山頂・谷・西の岩壁・氷河・東のゲレンデとリフト・湖・集落・橋の位置関係が、参考と同じに読める"}
  - {id: 2,  name: "山の形",     look: "鋭い尾根と支尾根、深い谷、立ち上がる山頂。なだらかな丘や、のっぺりした面に見えない"}
  - {id: 3,  name: "岩",         look: "岩壁と岩の筋が、雪の溝と交互に並ぶ。色と縦の割れ目が参考に近い。板や塗りつぶしに見えない"}
  - {id: 4,  name: "氷河",       look: "青白い氷の段が、谷に沿って曲がって流れる。帯や縞模様に見えない"}
  - {id: 5,  name: "森",         look: "雪をかぶった針葉樹が、谷の両側と麓にまとまって立つ。遠くからも森として読める"}
  - {id: 6,  name: "湖",         look: "青緑の水と白い氷のまだら、入り組んだ岸。平らな色の面に見えない"}
  - {id: 7,  name: "集落と橋",   look: "木と石の山荘と小屋、アーチの橋、リフトが、湖の北東の岸にまとまって見える"}
  - {id: 8,  name: "光と空",     look: "青い空、日なたの白い雪と青い影、南東からの光。暗すぎ・白飛び・霞みすぎが無い"}
  - {id: 9,  name: "遠景",       look: "地図の外へ山並みが続き、地図の端が切れて見えない"}
  - {id: 10, name: "破綻の無さ", look: "浮いた物・突き抜け・繰り返しの模様・不自然な直線や四角が無い"}
loop_control:
  retry: "不合格なら上位5件だけを実装へ戻す。上限3周。同じ指摘が2周続いたら止めて作者へ返す"
  before_fixing: "指摘を課題にする前に、撮影の不備（読み込みの途中・視点のずれ）を先に疑う"
limits:
  - "AI の採点は、人の目の代理。最後は作者が実画面で見る"
receipt: ".agent-harness/runs/visual/valley/<周>/ に、採点表と並べた絵（絵は Git に入れない）、直した点と直さなかった点を残す"
