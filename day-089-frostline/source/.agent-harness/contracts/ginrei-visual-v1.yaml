# 見た目（雪山の画）を、参照写真との固定撮影で磨く周回の契約
meta: {name: "ginrei-visual", version: "1.0.0", status: draft, owner: "作者"}
goal: >
  固定の場面で撮った画が、実際の雪山の写真と並べても雪山に見える。既存のゲームの画に似せることは目標にしない。
references:
  source: "実際の雪山と滑走の写真（CC0 か、内部の比較に使える条件のもの）。出どころは docs/assets-ledger.md に書く"
  storage: "refs/ に置き、git に入れない。既存のゲームの画面写真は参照にしない"
  measure: "写真ごとに、明るさの上位の値・白飛びの割合・日なたと日陰の比・主な色を測り、同じ尺度で自分の画も測る"
shots:
  rule: "参照1枚につき、名前のついた固定の場面を1つ作る。種・時刻・刻みを固定し、数十コマ回して落ち着いてから撮る"
  widths: ["1440x900", "390x844"]
  capture: "画面の下まで撮る。画面の部品の判定は、3D の画と別の画像で行う"
roles:
  - {role: design,    runner: "設計役", does: "参照と場面を決め、指摘を「足りない・平ら・同じ」に仕分け、上位5件に絞る"}
  - {role: implement, runner: "実装役（画を見られる担い手）", does: "規則（色の出どころ・配り方・連続性）を直す。個々の物より規則を優先する"}
  - {role: gate,      runner: "決定的な道具", does: "単体試験・起動の検査（誤り・警告なし）・性能の下限"}
  - {role: evaluate,  runner: "実装役と別の担い手（別の会話）", does: "画像だけを見て採点。コードは見ない"}
  - {role: final,     runner: "作者", does: "実画面を見て合否を決める"}
rubric:   # 10項目 × 0〜2点。合格は16点以上かつ0点なし
  - {id: 1,  name: "山の形",         look: "尾根・沢・崖の形が自然で、作り物の繰り返しに見えない"}
  - {id: 2,  name: "雪面の質感",     look: "近くで粒と風紋、遠くでなめらか。平らな白い板に見えない"}
  - {id: 3,  name: "光と影",         look: "日なたと日陰の比が写真に近い。影が青く、黒い穴にならない"}
  - {id: 4,  name: "空と大気",       look: "空・霞・遠景の色がつながり、地平線に継ぎ目が無い"}
  - {id: 5,  name: "岩と雪の境",     look: "急な面に岩が出て、境目が不自然な縞にならない"}
  - {id: 6,  name: "木",             look: "樹氷と木が雪をかぶり、地面に立って見える。同じ形の繰り返しに見えない"}
  - {id: 7,  name: "滑走者",         look: "姿勢が滑りに合い、雪面に接して見える"}
  - {id: 8,  name: "雪煙と跡",       look: "雪煙が量と向きで滑りを伝え、跡が雪面に残って見える"}
  - {id: 9,  name: "色調",           look: "白飛び・黒つぶれが無く、全体の色が写真の範囲にある"}
  - {id: 10, name: "安定",           look: "ちらつき・継ぎ目・ポップ・破綻が無い"}
loop_control:
  retry: "不合格なら上位5件だけを実装へ戻す。上限3周。同じ指摘が2周続いたら止めて作者へ返す"
  ab: "直した箇所には、周・指摘の引用・旧値→新値を残す。1変更ずつ切り替えて前後を撮り比べられるようにする"
  before_fixing: "指摘を実装の課題にする前に、撮影の不備（落ち着く前の撮影・下端の欠け）を先に疑う"
receipt: ".agent-harness/runs/visual/<周>/ に、採点表・前後の画像・測った値・直した点と直さなかった点を残す"
