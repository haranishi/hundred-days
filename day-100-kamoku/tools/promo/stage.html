<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1, maximum-scale=1">
<title>kamoku 宣伝動画ステージ（撮影用）</title>
<link rel="stylesheet" href="stage.css">
</head>
<body>
<div id="stage">
  <div id="win"><iframe id="app" name="app" title="kamoku"></iframe><div id="scrim"></div></div>
  <div id="band"></div>
  <div id="top-shade"></div>
  <div id="fx">
    <div id="finger"><i></i></div>
    <div id="callout">
      <div class="callout-label"></div>
      <div class="callout-value"></div>
      <div class="callout-rows" hidden></div>
    </div>
    <div id="pv">
      <div class="pv-head"><span class="pv-title">仕訳のプレビュー</span><span class="pv-stamp" hidden></span></div>
      <div class="pv-rows"></div>
    </div>
  </div>
  <div id="ff">早送り</div>
  <div id="calm-card"></div>
  <div id="cap"></div>
  <div id="cap-note"></div>
  <div id="cap-tag"></div>
  <div id="endcard">
    <div id="end-group">
      <div id="end-brand-tile"><img id="end-brand" alt=""><div id="end-brand-fallback">kamoku</div></div>
      <div id="end-pills"></div>
      <div id="end-cta"></div>
      <div id="end-url"></div>
      <div id="end-series"></div>
      <div id="end-disclaimer"></div>
    </div>
  </div>
</div>
<script src="stage.js"></script>
</body>
</html>
