<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1, maximum-scale=1">
<title>UXレシピ 宣伝動画のステージ（撮影用・本番には出ない）</title>
<link rel="stylesheet" href="/stage/stage.css">
</head>
<body>
<div id="stage">
  <div id="band">
    <div id="brand">DAY 96 / 100</div>
    <div id="cap"></div>
    <div id="stripe"></div>
  </div>
  <div id="appwrap"></div>
  <div id="fx">
    <div id="labels"></div>
    <div id="hls"></div>
    <div id="ripple"></div>
    <div id="finger"><i></i></div>
    <div id="callout"><div class="c1"></div><div class="c2"></div></div>
    <div id="badge"></div>
    <div id="flash"></div>
  </div>
  <div id="endcard">
    <div id="end-strip"></div>
    <div id="end-inner">
      <div id="end-label"></div>
      <div id="end-lead"></div>
      <div id="end-head"><img id="end-logo" alt="" src="/app/favicon.svg"><div id="end-title"></div></div>
      <div id="end-sub"></div>
      <div id="end-pills"></div>
      <div id="end-series"></div>
      <div id="end-cta"></div>
      <div id="end-url"></div>
    </div>
  </div>
</div>
<script src="/stage/stage.js"></script>
</body>
</html>
