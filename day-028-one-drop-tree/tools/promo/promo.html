<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>ひとしずくの木 — プロモーション動画</title>
  <link rel="stylesheet" href="./promo.css">
</head>
<body>
  <main id="promo" aria-label="ひとしずくの木 プロモーション動画">
    <div id="hero" aria-hidden="true">
      <div id="hero-card">
        <canvas id="hero-canvas" width="880" height="880"></canvas>
      </div>
    </div>

    <section id="title-scene" class="title-scene" aria-label="タイトル">
      <p id="challenge-label">DAY 028 · 100日チャレンジ</p>
      <h1 id="main-title">ひとしずくの木</h1>
      <p id="main-lead">1日1回、水をあげる。<br>それだけで育つ木。</p>
    </section>

    <div id="phone" class="phone" aria-label="ひとしずくの木 アプリ画面">
      <div class="phone-speaker" aria-hidden="true"></div>
      <div class="phone-screen">
        <iframe id="app-frame" title="ひとしずくの木" data-src="/index.html"></iframe>
        <canvas id="plant-overlay" aria-hidden="true"></canvas>
      </div>
    </div>

    <div id="focus-rings" aria-hidden="true">
      <div class="focus-ring"></div>
    </div>
    <div id="tap-ripple" aria-hidden="true"></div>

    <section id="promise-scene" class="promise-scene" aria-label="このアプリの約束">
      <p>木は、端末の中だけで育つ。</p>
      <p>通知なし・登録なし。</p>
      <p class="green">通信ゼロ・無料</p>
    </section>

    <section id="end-scene" class="end-scene" aria-label="ひとしずくの木 URL">
      <h2>ひとしずくの木</h2>
      <p class="url">hundred-days.pages.dev/<br>day-028-one-drop-tree/</p>
      <p class="day">100日チャレンジ Day 28</p>
    </section>

    <div id="caption" class="caption" aria-live="off"></div>
    <div id="fade-black" aria-hidden="true"></div>
  </main>
  <script type="module" src="./promo.js"></script>
</body>
</html>
